<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="brand">Churn Predictor</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Predict</a>
            <a href="{{ url_for('logs') }}" class="{% if request.endpoint == 'logs' %}active{% endif %}">Logs</a>
            <a href="{{ url_for('plots') }}" class="{% if request.endpoint == 'plots' %}active{% endif %}">Visualizations</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer style="text-align:center; padding:2rem 0; color:#555; font-size:0.8rem; border-top:1px solid #222; margin-top:2rem;">
        Churn Prediction Demo &bull; Custom Logistic Regression &bull; Built with Flask
    </footer>
</body>
</html>
