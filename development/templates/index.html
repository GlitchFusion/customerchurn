{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Predict Customer Churn</h2>
    <p>Enter the customer details below to get a churn probability.</p>

    <form id="predictForm" method="POST" action="{{ url_for('predict') }}">
        <!-- two-column layout for compactness -->
        <div class="row">
            <div>
                <label>Gender</label>
                <select name="gender">
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>

                <label>Senior Citizen</label>
                <select name="SeniorCitizen">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

                <label>Partner</label>
                <select name="Partner">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>Dependents</label>
                <select name="Dependents">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>Tenure (months)</label>
                <input type="number" name="tenure" value="12" min="0" max="100">

                <label>Phone Service</label>
                <select name="PhoneService">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>Multiple Lines</label>
                <select name="MultipleLines">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No phone service">No phone service</option>
                </select>
            </div>

            <div>
                <label>Internet Service</label>
                <select name="InternetService">
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="No">No</option>
                </select>

                <label>Online Security</label>
                <select name="OnlineSecurity">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>

                <label>Online Backup</label>
                <select name="OnlineBackup">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>

                <label>Device Protection</label>
                <select name="DeviceProtection">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>

                <label>Tech Support</label>
                <select name="TechSupport">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>

                <label>Streaming TV</label>
                <select name="StreamingTV">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>

                <label>Streaming Movies</label>
                <select name="StreamingMovies">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>
        </div>

        <!-- second row for remaining fields -->
        <div class="row">
            <div>
                <label>Contract</label>
                <select name="Contract">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>

                <label>Paperless Billing</label>
                <select name="PaperlessBilling">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div>
                <label>Payment Method</label>
                <select name="PaymentMethod">
                    <option value="Electronic check">Electronic check</option>
                    <option value="Mailed check">Mailed check</option>
                    <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                    <option value="Credit card (automatic)">Credit card (automatic)</option>
                </select>

                <label>Monthly Charges ($)</label>
                <input type="number" name="MonthlyCharges" value="70" step="0.01" min="0">

                <label>Total Charges ($)</label>
                <input type="number" name="TotalCharges" value="1000" step="0.01" min="0">
            </div>
        </div>

        <button type="submit" class="btn">Predict Churn</button>
    </form>

    <div id="result" class="result-box" style="display:none;">
        <h3>Prediction Result</h3>
        <div class="probability">Churn Probability: <span id="probValue"></span></div>
        <div class="label">Prediction: <span id="predLabel"></span></div>
    </div>
</div>

<script>
    document.getElementById('predictForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = this;
        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.error) {
                alert('Error: ' + data.error);
                return;
            }

            // show result box
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            document.getElementById('probValue').textContent = (data.churn_probability * 100).toFixed(2) + '%';
            const predLabel = document.getElementById('predLabel');
            predLabel.textContent = data.churn_prediction + ' (' + data.prediction_label + ')';
            // color based on risk
            predLabel.style.color = data.churn_prediction === 'Yes' ? '#ff6b6b' : '#69db7c';
        } catch (err) {
            alert('Request failed: ' + err.message);
        }
    });
</script>

{% endblock %}
